<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Running Wild map</title>
<meta name="description" content="SingleTrack Running Wild race-day map: the whole course, aid stations, access points, helicopter landing sites, Safety Officers and every tracked runner, on one screen.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#223c2c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12231a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-48.png" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="lib/fonts.css?v=2">
<link rel="stylesheet" href="lib/leaflet.css?v=2">
<link rel="stylesheet" href="css/app.css?v=2">
</head>
<body class="mappage">
<header class="top">
  <a class="brand" href="./" aria-label="Running Wild Safety home"><span class="brand-rw">Running Wild</span><span class="brand-app">Safety map</span></a>
  <span id="mpStatus" class="mp-status" role="status"></span>
  <nav class="mp-nav">
    <button id="mpRunners" class="mp-btn" type="button" aria-expanded="false">Runners</button>
    <a id="mpFind" class="mp-btn" href="./">Find</a>
  </nav>
  <span id="net" class="net" hidden>Offline</span>
</header>

<main class="mp-main">
  <div class="mp-mapbox"><div id="map" aria-label="Course map"></div></div>
  <aside id="mpPanel" class="mp-panel" hidden aria-label="Runners"></aside>
</main>

<script src="js/live.js?v=2"></script>
<script src="lib/leaflet.js?v=2"></script>
<script src="data/config.js?v=2"></script>
<script src="data/course.js?v=2"></script>
<script src="data/courses.js?v=2"></script>
<script src="data/access-edits.js?v=2"></script>
<script src="data/contingency.js?v=2"></script>
<script src="js/engine.js?v=2"></script>
<script src="data/tiles.js?v=2"></script>
<script src="js/basemap.js?v=2"></script>
<script src="data/helipads.js?v=2"></script>
<script src="js/helipads.js?v=2"></script>
<script src="data/track-grades.js?v=2"></script>
<script src="js/track.js?v=2"></script>
<script src="js/contingency.js?v=2"></script>
<script src="data/safety-officers.js?v=2"></script>
<script src="data/pacing.js?v=2"></script>
<script src="data/demo-runners.js?v=2"></script>
<script src="js/demo.js?v=2"></script>
<script src="js/timing.js?v=2"></script>
<script src="js/tracking.js?v=2"></script>
<script src="js/fullscreen.js?v=2"></script>
<script src="js/runners.js?v=2"></script>
<script src="js/intro.js?v=2"></script>
<script src="js/map.js?v=2"></script>
</body>
</html>
